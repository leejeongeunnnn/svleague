name: SV리그 데이터 자동 수집

on:
  schedule:
    # UTC 기준 (한국·일본 시간 = UTC+9). GitHub 예약은 가끔 건너뛰므로 넉넉히 걸어 둔다.
    - cron: "17,47 * * * *"       # 하루 종일 30분마다
    - cron: "7-57/10 3-13 * * *"  # 한국시간 12~22시(경기 시간대)엔 10분마다
  workflow_dispatch:              # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write
  actions: write     # 경기 날 실시간 수집을 깨우기 위해

concurrency:
  group: svleague-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        run: python collect.py
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f data/live.json   # 실시간 파일은 live 브랜치 전용
          git add data/
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: SV리그 데이터 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "푸시 충돌, 재시도 $i"; sleep 5
          done
          exit 1
      - name: 경기 날이면 실시간 수집 깨우기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(python -c "
          import json, datetime
          t = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date().isoformat()
          g = json.load(open('data/schedule.json', encoding='utf-8'))['games']
          print(sum(1 for x in g if x['date'] == t and x['state'] not in ('final', 'cancel')))")
          running=$(gh run list -R "${{ github.repository }}" -w live.yml --json status -q '[.[] | select(.status != "completed")] | length')
          echo "오늘 남은 경기 $pending · 실행 중인 실시간 수집 $running"
          if [ "$pending" -gt 0 ] && [ "$running" = "0" ]; then
            gh workflow run live.yml -R "${{ github.repository }}" --ref main && echo "실시간 수집을 켰습니다"
          fi
