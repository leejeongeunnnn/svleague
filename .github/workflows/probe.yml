name: 임시 페이지 구조 확인
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests
      - run: python probe_photos.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_debug/probe && git commit -m "chore: 페이지 구조 확인용 샘플" && git pull --rebase -q origin main && git push -q origin HEAD:main || true
